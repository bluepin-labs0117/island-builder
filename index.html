<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>Island Builder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87ceeb;
      /* タッチ操作をブラウザのスクロール/ズームに奪われないようにする */
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
    }
    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
    }

    /* ===== 操作UI ===== */
    #ui {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none; /* 余白はキャンバス操作を邪魔しない */
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    #ui button,
    #ui input {
      pointer-events: auto;
      touch-action: manipulation;
    }
    .ui-btn {
      border: none;
      border-radius: 12px;
      background: rgba(20, 28, 38, 0.62);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      padding: 0 16px;
      min-height: 46px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      cursor: pointer;
    }
    .ui-btn:active {
      transform: scale(0.97);
    }
    .mode-btn {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      right: calc(env(safe-area-inset-right, 0px) + 12px);
    }
    .mode-btn.editing {
      background: rgba(46, 127, 214, 0.85);
    }

    .edit-panel {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 14px 14px calc(env(safe-area-inset-bottom, 0px) + 14px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.4));
    }
    .edit-panel.hidden {
      display: none;
    }
    .tool-row {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .tool-btn {
      flex: 1 1 0;
      max-width: 160px;
    }
    .tool-btn.active {
      background: rgba(46, 127, 214, 0.9);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.7) inset;
    }
    .sliders {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
      background: rgba(20, 28, 38, 0.55);
      border-radius: 12px;
      padding: 10px 12px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .slider-label {
      flex: 0 0 76px;
      font-size: 13px;
    }
    .slider-val {
      flex: 0 0 42px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      opacity: 0.85;
    }
    .slider-row input[type="range"] {
      flex: 1 1 auto;
      height: 40px;
      accent-color: #2e7fd6;
    }
  </style>

  <!-- Three.js を CDN（importmap）で読み込む。npm / ビルド不要 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
